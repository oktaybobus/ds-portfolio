name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra boost --extra data --extra app --extra api --extra detect --extra spark --extra deeprl

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Both `uv sync` and `uv run` must target the matrix interpreter. Without
    # this, `uv run` falls back to .python-version, discards the synced
    # environment and reinstalls without the dev extra.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra boost --extra data --extra app --extra api --extra detect

      # laptop_data.csv is committed, so this covers the full path from CSV to
      # scored model. Projects whose data is fetched are excluded by marker.
      - name: Run tests
        run: uv run pytest -m "not needs_data and not needs_dl" --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  train:
    name: End-to-end training smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra catboost

      # Proves the CLI, the config, the pipeline and the artifact writer still
      # work together - the failure mode unit tests cannot see.
      - name: Train laptop_price from the committed dataset
        run: uv run dsj train laptop_price

      - name: Score a single record against the saved model
        run: |
          uv run dsj predict laptop_price --json '{"company":"Dell","type_name":"Gaming","ram_gb":16,"ssd_gb":512,"cpu_brand":"Intel Core i7","gpu_brand":"Nvidia GTX"}'

      - name: Show the project table
        run: uv run dsj list

  spark:
    name: Spark jobs (Java 17)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      # PySpark is a Python package wrapping a JVM application; without a JDK
      # every Spark test skips itself and the job passes without testing.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra spark

      # needs_spark tests skip themselves when there is no JVM, so without this
      # guard a broken Java setup would look like a green job.
      - name: Confirm Spark can actually start
        run: uv run python -c "from dsjourney.spark import spark_available; assert spark_available()"

      # Marvel-graph.txt and the Pima records are committed, so this is the real
      # distributed job on the real data, not a fixture.
      - name: Run the Spark tests
        run: uv run pytest -m needs_spark

      - name: Measure the Marvel graph end to end
        run: uv run python projects/marvel_network/train.py --benchmark

      - name: Train the Pima classifier end to end
        run: uv run python projects/diabetes_screening/train.py

  reinforcement-learning:
    name: RL agents
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra deeprl

      # needs_rl tests skip themselves when gymnasium is absent, so without this
      # a broken install would look like a green job.
      - name: Confirm the environments and torch are present
        run: uv run python -c "from dsjourney.rl import gymnasium_installed, sb3_installed; assert gymnasium_installed() and sb3_installed()"

      - name: Run the RL tests
        run: uv run pytest -m "needs_rl or needs_deeprl"

      # Both DQNs train in under 20 seconds; the seed sweep is the slow half, so
      # it runs at a reduced budget here and at full size in `make rl`.
      # --seeds is the point: a single DQN run reached 500 locally and 18.9
      # here, and the first version of this job printed that without failing.
      - name: Score the CartPole agents end to end
        run: uv run python projects/cartpole_balance/train.py --seeds 3 --episodes 50

      - name: Score the FrozenLake agents end to end
        run: uv run python projects/frozenlake_control/train.py --seeds 4 --episodes 6000 --eval-episodes 500

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ds-portfolio:ci .

      # ENTRYPOINT is `dsj`, so the arguments are the subcommand - not `dsj train`.
      - name: List projects inside the image
        run: docker run --rm ds-portfolio:ci list

      # Train and score in one container: `--rm` discards the filesystem, so a
      # model written by an earlier `docker run` is gone by the next one. Real
      # use mounts a volume onto /app/artifacts instead.
      - name: Train and score inside the image
        run: |
          docker run --rm --entrypoint /bin/sh ds-portfolio:ci -c '
            set -e
            dsj train laptop_price
            dsj predict laptop_price --json "{\"company\":\"Dell\",\"type_name\":\"Gaming\",\"ram_gb\":16,\"ssd_gb\":512}"
          '

