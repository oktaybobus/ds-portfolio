# Registry of every dataset a project needs.
#
# scripts/fetch_assets.py resolves each entry in order:
#   1. already present under data/raw/<project>/  -> nothing to do
#   2. committed_in_repo: true                    -> nothing to fetch
#   3. local_source                               -> copied from the original
#                                                    course tree on this machine
#   4. hf_repo + hf_path                          -> downloaded from the mirror
#   5. source_url (+ archive_member)              -> fetched from the publisher
#
# Only laptop_data.csv is small enough to live in git; it keeps CI able to run a
# real end-to-end training test with no network access.
#
# The mirror OKTAYBBS/ds-portfolio-data is a **private** Hugging Face dataset:
# most of these files are third-party and republishing them openly is not ours
# to do. Downloading from it needs `hf auth login` with an account that has
# access. MovieLens is deliberately absent - see movielens_ratings below.

assets:
  laptop_data:
    project: laptop_price
    file: laptop_data.csv
    size_mb: 0.18
    committed_in_repo: true
    local_source: "PROJELER/project2-Laptop Price Prediction - Regression/laptop_data.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: laptop_price/laptop_data.csv
    description: 1303 laptop listings with hardware specs and price (Kaggle)

  loans_training_set:
    project: loan_default
    file: LoansTrainingSet.csv
    size_mb: 45.0
    committed_in_repo: false
    local_source: "PROJELER/project8-AOB- Loan Prediction - Classification/LoansTrainingSet.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: loan_default/LoansTrainingSet.csv
    description: ~256k consumer loan applications labelled fully-paid / charged-off

  ecommerce_transactions:
    project: customer_segments
    file: PBL5recommendationdata.csv
    size_mb: 6.7
    committed_in_repo: false
    local_source: "PROJELER/project9-AOB- Customer Segmentetion-Clustering/PBL5recommendationdata.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: customer_segments/PBL5recommendationdata.csv
    description: Online retail transaction log used to build RFM customer segments

  restaurant_reviews:
    project: review_sentiment
    file: restaurantt.csv
    size_mb: 8.5
    committed_in_repo: false
    local_source: "PROJELER/project13-NLP Class & Sentiment Anlysis/restaurantt.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: review_sentiment/restaurantt.csv
    description: Restaurant reviews with star ratings, mapped to sentiment labels

  delhi_climate:
    project: series_forecast
    file: DailyDelhiClimateTrain.csv
    size_mb: 0.08
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week10 bigdata/art intelligence/DailyDelhiClimateTrain.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: series_forecast/DailyDelhiClimateTrain.csv
    description: 1462 days of New Delhi weather - mean temperature, humidity, wind, pressure

  adidas_sales:
    project: series_forecast
    file: adidas-quarterly-sales.csv
    size_mb: 0.001
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week10 bigdata/art intelligence/adidas-quarterly-sales.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: series_forecast/adidas-quarterly-sales.csv
    description: 87 quarters of Adidas revenue, 2000Q1 onward

  # Not mirrored. ml-100k/README: "The user may not redistribute the data
  # without separate permission." Fetched from GroupLens instead, which also
  # means a fresh clone gets the pristine 100,000-rating file rather than the
  # course tree's edited copy - see the project README, "About user 0".
  movielens_ratings:
    project: movie_recommender
    file: u.data
    size_mb: 1.9
    committed_in_repo: false
    local_source: "DATA SCIENCE COURSE/week10 bigdata/spark/ml-100k/u.data"
    source_url: https://files.grouplens.org/datasets/movielens/ml-100k.zip
    archive_member: ml-100k/u.data
    description: >-
      MovieLens 100k - ships 100,003 ratings from 944 users, not the
      100,000/943 u.info declares. Extra 3 rows: synthetic user_id 0, absent
      from u.user (see movie_recommender's README, "About user 0")

  movielens_items:
    project: movie_recommender
    file: u.item
    size_mb: 0.23
    committed_in_repo: false
    local_source: "DATA SCIENCE COURSE/week10 bigdata/spark/ml-100k/u.item"
    source_url: https://files.grouplens.org/datasets/movielens/ml-100k.zip
    archive_member: ml-100k/u.item
    description: MovieLens 100k film catalogue with 19 binary genre flags

  istanbul_listings:
    project: istanbul_housing
    file: satilikdaire.xlsx
    size_mb: 1.3
    committed_in_repo: false
    local_source: "PROJELER/project14-AOB- Regression_Final_Project/satilikdaire.xlsx"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: istanbul_housing/satilikdaire.xlsx
    description: 10,735 Istanbul apartment listings scraped from Emlakjet, 18 raw columns

  wikipedia_articles:
    project: article_search
    file: all_articles
    directory: true
    size_mb: 9.4
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week14/all_articles"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: article_search/all_articles.zip
    description: 390 Wikipedia articles on human rights, conflict and international law

  cv_samples:
    project: object_detection
    file: images
    directory: true
    copy_patterns: ["*.jpg", "*.jpeg", "haarcascade_*.xml"]
    size_mb: 1.8
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week8 Computer vision"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: object_detection/images.zip
    description: Sample photographs and Haar cascade files from the computer-vision week

  marvel_graph:
    project: marvel_network
    file: Marvel-graph.txt
    size_mb: 1.6
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week10 bigdata/spark/Marvel-graph.txt"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: marvel_network/Marvel-graph.txt
    description: Adjacency lists for 6,486 Marvel characters, one line per comic appearance batch

  marvel_names:
    project: marvel_network
    file: Marvel-names.txt
    size_mb: 0.35
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week10 bigdata/spark/Marvel-names.txt"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: marvel_network/Marvel-names.txt
    description: 19,428 character id-to-name rows. Latin-1, not UTF-8 - two lines fail a strict UTF-8 read

  pima_diabetes:
    project: diabetes_screening
    file: pima-indians-diabetes.csv
    size_mb: 0.024
    committed_in_repo: true
    local_source: "DATA SCIENCE COURSE/week10 bigdata/spark/pima-indians-diabetes.csv"
    hf_repo: OKTAYBBS/ds-portfolio-data
    hf_path: diabetes_screening/pima-indians-diabetes.csv
    description: 768 clinical records, 35% diabetic. Missing values are encoded as 0 in five columns

# Image datasets are pulled straight from Kaggle at training time by kagglehub;
# they are far too large to mirror and each one is public.
kaggle_datasets:
  grape: rm1000/augmented-grape-disease-detection-dataset
  rice: muratkokludataset/rice-image-dataset
  fruits_veg: kritikseth/fruit-and-vegetable-image-recognition
  fish: crowww/a-large-scale-fish-dataset
  tomato: kaustubhb999/tomatoleaf
  animal: emirhanai/animal-computer-vision-clean-dataset-code-cnnai
  brain: sartajbhuvaji/brain-tumor-classification-mri
  dental: imtkaggleteam/dental-radiography
