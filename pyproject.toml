[project]
name = "dsjourney"
version = "0.1.0"
description = "Shared data-science toolkit and project portfolio distilled from a 15-week AI/ML curriculum"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ali Oktay Bobus", email = "alioktaybobus@gmail.com" }]
keywords = ["machine-learning", "data-science", "scikit-learn", "portfolio"]

dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "statsmodels>=0.14",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Split per library so a deployment can take only what it needs: on Linux,
# xgboost drags in nvidia-nccl-cu12 (~326 MB) that a CPU-only image has no use
# for. `boost` remains the union for local development.
catboost = ["catboost>=1.2"]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.3"]
boost = ["dsjourney[catboost,lightgbm,xgboost]"]
dl = ["tensorflow>=2.16; platform_machine != 'arm64'", "tensorflow-macos>=2.16; platform_machine == 'arm64' and platform_system == 'Darwin'"]
nlp = ["nltk>=3.8", "wordcloud>=1.9"]
app = ["streamlit>=1.35"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27"]
hub = ["huggingface-hub>=0.23"]
data = ["kagglehub>=0.3", "openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-pyyaml>=6.0",
]

[project.scripts]
dsj = "dsjourney.cli:app"

[project.urls]
Homepage = "https://github.com/oktaybobus/ds-portfolio"
Repository = "https://github.com/oktaybobus/ds-portfolio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsjourney", "projects", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train real models on real data",
    "needs_data: tests that require fetched datasets",
    "needs_dl: tests that require the optional deep-learning extra",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/dsjourney"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "projects", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dsjourney", "projects", "service"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# Turkish district and column names are data: the dotless i and other Turkish
# letters are correct here, not confusable typos.
"projects/istanbul_housing/*" = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src/dsjourney"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
