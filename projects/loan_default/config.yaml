name: loan_default
title: Loan Default Prediction
task: classification
summary: >-
  Predict whether a consumer loan will be charged off. 257k applications, 31%
  of them defaults - an imbalance that makes accuracy a useless headline number,
  so the model is selected and reported on recall and F1 instead.
source_notebook: "PROJELER/project8-AOB- Loan Prediction - Classification/HW11-AOB- 3-Loan prediction-Classification.ipynb"

target: charged_off

dataset:
  id: loans_training_set
  file: LoansTrainingSet.csv
  format: csv
  read_options:
    low_memory: false

split:
  test_size: 0.2
  random_state: 42
  stratify: true

model:
  estimator: random_forest
  params:
    n_estimators: 200
    max_depth: 18
    min_samples_leaf: 20
    class_weight: balanced
    random_state: 42
    n_jobs: -1
  scale_features: []

metrics: [accuracy, precision, recall, f1, roc_auc]
